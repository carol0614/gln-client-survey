<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>GLN · 新建案件</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:   #2B2B2B;
      --olive: #6B7355;
      --warm:  #A0714F;
      --sand:  #F5EFE6;
      --mist:  #E8E2D9;
      --taupe: #8E877D;
      --white: #FDFAF6;
      --error: #C0392B;
      --serif: 'Noto Serif TC', serif;
      --sans:  'Noto Sans TC', sans-serif;
      --radius: 10px;
    }

    body {
      font-family: var(--sans);
      background: var(--sand);
      color: var(--ink);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }

    .card {
      background: var(--white);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(43,43,43,0.08);
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2rem;
    }

    .logo-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .logo-text {
      font-family: var(--serif);
      font-size: 1rem;
      color: var(--olive);
      letter-spacing: 0.06em;
    }

    h1 {
      font-family: var(--serif);
      font-size: 1.4rem;
      color: var(--ink);
      margin-bottom: 0.4rem;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--taupe);
      margin-bottom: 1.75rem;
      line-height: 1.6;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--taupe);
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1.5px solid var(--mist);
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: var(--sans);
      color: var(--ink);
      background: var(--white);
      transition: border-color 0.15s;
      margin-bottom: 1.25rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--olive);
    }

    .btn-create {
      width: 100%;
      padding: 0.85rem;
      background: var(--olive);
      color: white;
      font-family: var(--serif);
      font-size: 1rem;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-create:hover { background: #5a6244; }
    .btn-create:disabled { opacity: 0.5; cursor: default; }

    /* 結果卡 */
    .result-card {
      display: none;
      margin-top: 1.75rem;
      background: #F2EBE0;
      border: 1px solid #E8D8C4;
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .result-meta {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .meta-num {
      font-family: var(--serif);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: 0.04em;
    }

    .meta-loc {
      font-size: 0.9rem;
      color: var(--taupe);
    }

    .result-label {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: var(--warm);
      margin-bottom: 0.35rem;
    }

    .result-url {
      font-size: 0.82rem;
      color: var(--ink);
      word-break: break-all;
      line-height: 1.6;
      margin-bottom: 1rem;
      background: white;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--mist);
    }

    .result-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .btn-action {
      padding: 0.65rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: var(--sans);
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: all 0.15s;
    }

    .btn-copy {
      background: white;
      color: var(--ink);
      border-color: var(--mist);
    }
    .btn-copy:hover { border-color: var(--olive); color: var(--olive); }

    .btn-line {
      background: #06C755;
      color: white;
      border-color: #06C755;
    }
    .btn-line:hover { background: #05b34d; border-color: #05b34d; }

    /* 錯誤 */
    .error-msg {
      display: none;
      margin-top: 1rem;
      color: var(--error);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    /* Auth gate */
    .auth-gate {
      display: none;
      text-align: center;
      color: var(--error);
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--taupe);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div class="logo-wrap">
      <img src="assets/gln-circle.png" alt="GLN" class="logo-img" />
      <span class="logo-text">Good Living Notes</span>
    </div>

    <div id="auth-gate" class="auth-gate">
      需要授權才能進入。<br />
      請在網址後加上 <code>?t=admin</code>
    </div>

    <div id="app" style="display:none;">
      <h1>新建案件</h1>
      <p class="subtitle">填入地區與路名，案件編號自動遞增排序。</p>

      <label for="location-input">地區 + 路名</label>
      <input type="text" id="location-input" placeholder="例：大安區 仁愛路三段" maxlength="60" autocomplete="off" />

      <button class="btn-create" id="btn-create">建立客戶連結</button>

      <div class="result-card" id="result-card">
        <div class="result-meta" id="result-meta"></div>
        <div class="result-label" style="margin-top:0.9rem;">客戶問卷連結</div>
        <div class="result-url" id="result-url"></div>
        <div class="result-actions">
          <button class="btn-action btn-copy" id="btn-copy">複製連結</button>
          <a class="btn-action btn-line" id="btn-line" href="#" target="_blank">傳送 LINE</a>
        </div>
      </div>

      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <div class="footer">GLN · 此頁僅供內部使用</div>

  <script>
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzCpoKgXvana8_6cxxB1jrn0qCW8ulw7iX-vVrDJbqCQZ36KjAhHJRNAd489N_z564zsw/exec';
    const ADMIN_KEY    = 'gln-admin-2026';
    const PAGES_BASE   = 'https://carol0614.github.io/gln-client-survey';

    const params = new URLSearchParams(location.search);

    if (params.get('t') !== 'admin') {
      document.getElementById('auth-gate').style.display = 'block';
    } else {
      document.getElementById('app').style.display = 'block';
    }

    document.getElementById('btn-create').addEventListener('click', async () => {
      const location = document.getElementById('location-input').value.trim();
      const btn      = document.getElementById('btn-create');
      const result   = document.getElementById('result-card');
      const errEl    = document.getElementById('error-msg');

      result.style.display = 'none';
      errEl.style.display  = 'none';

      if (!location) {
        errEl.textContent   = '請填入地區與路名。';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled    = true;
      btn.textContent = '建立中…';

      try {
        const res  = await fetch(GAS_ENDPOINT, {
          method:  'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body:    JSON.stringify({ action: 'create_token', adminKey: ADMIN_KEY, location }),
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || '伺服器錯誤');

        const url     = json.clientUrl || (PAGES_BASE + '/?t=' + json.clientToken);
        const projNum = json.projectNumber || '';
        const lineMsg = encodeURIComponent(
          '【GLN 生活習慣討論表】\n\n' +
          '您好，以下是您的專屬問卷連結，填寫完成後我們會為您產出專屬的居家生活報告。\n\n' +
          url + '\n\n' +
          '如有任何問題歡迎隨時與我們聯繫。\nGLN 好感生活提案'
        );

        document.getElementById('result-meta').innerHTML =
          `<span class="meta-num">${projNum}</span><span class="meta-loc">${location}</span>`;
        document.getElementById('result-url').textContent = url;
        document.getElementById('btn-line').href = 'https://line.me/R/msg/text/' + lineMsg;
        result.style.display = 'block';

        document.getElementById('location-input').value = '';

        document.getElementById('btn-copy').onclick = async () => {
          await navigator.clipboard.writeText(url);
          const orig = document.getElementById('btn-copy').textContent;
          document.getElementById('btn-copy').textContent = '已複製 ✓';
          setTimeout(() => { document.getElementById('btn-copy').textContent = orig; }, 2000);
        };

      } catch (err) {
        errEl.textContent   = '建立失敗：' + err.message;
        errEl.style.display = 'block';
      } finally {
        btn.disabled    = false;
        btn.textContent = '建立客戶連結';
      }
    });

    // Enter 鍵觸發
    document.getElementById('location-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-create').click();
    });
  </script>

</body>
</html>
