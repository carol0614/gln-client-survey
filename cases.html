<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>GLN 案件後台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600&family=Ibarra+Real+Nova:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .cases-header {
      text-align: center;
      padding: 3rem 0 2rem;
      border-bottom: 1px solid var(--gln-mist);
      margin-bottom: 2.5rem;
    }
    .cases-header h1 {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      margin: 0.5rem 0 0.25rem;
      color: var(--gln-ink);
    }
    .cases-header p {
      color: var(--gln-taupe);
      font-size: 0.9rem;
      margin: 0;
    }
    .cases-logo {
      width: 48px;
      height: auto;
      opacity: 0.85;
      margin-bottom: 0.75rem;
    }

    /* 搜尋列 */
    .cases-toolbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .cases-search {
      flex: 1;
      min-width: 200px;
      padding: 0.55rem 0.875rem;
      border: 1px solid var(--gln-mist);
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      background: #fff;
      color: var(--gln-ink);
      outline: none;
    }
    .cases-search:focus { border-color: var(--gln-olive); }
    .cases-count {
      font-size: 0.85rem;
      color: var(--gln-taupe);
      white-space: nowrap;
    }

    /* 案件卡片 */
    .case-card {
      background: #fff;
      border: 1px solid var(--gln-mist);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem 1.5rem;
      align-items: start;
      transition: border-color 0.15s;
    }
    .case-card:hover { border-color: var(--gln-olive); }

    .case-meta { min-width: 0; }
    .case-id {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gln-ink);
      letter-spacing: 0.04em;
      margin: 0 0 0.2rem;
    }
    .case-client {
      font-size: 1rem;
      color: var(--gln-ink);
      margin: 0 0 0.2rem;
    }
    .case-address {
      font-size: 0.85rem;
      color: var(--gln-taupe);
      margin: 0 0 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .case-time {
      font-size: 0.8rem;
      color: var(--gln-taupe);
      margin: 0;
    }

    .case-actions {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .case-badge {
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      border-radius: 20px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .badge-success { background: #e8f0e6; color: #4a7040; }
    .badge-none    { background: var(--gln-mist); color: var(--gln-taupe); }
    .badge-failed  { background: #fce8e8; color: #a03030; }

    .btn-report {
      display: inline-block;
      padding: 0.45rem 1rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      font-family: var(--font-sans);
      text-decoration: none;
      border: 1px solid;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn-designer {
      background: var(--gln-olive);
      color: #fff;
      border-color: var(--gln-olive);
    }
    .btn-designer:hover { background: #636b62; }
    .btn-client {
      background: transparent;
      color: var(--gln-olive);
      border-color: var(--gln-mist);
    }
    .btn-client:hover { border-color: var(--gln-olive); }

    /* 空狀態 */
    .empty-state {
      text-align: center;
      padding: 4rem 0;
      color: var(--gln-taupe);
    }
    .empty-state p { margin: 0.5rem 0; }

    /* 登入表單 */
    .login-wrap {
      max-width: 360px;
      margin: 6rem auto;
      text-align: center;
    }
    .login-wrap h2 {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      color: var(--gln-ink);
    }
    .login-input {
      width: 100%;
      padding: 0.65rem 1rem;
      border: 1px solid var(--gln-mist);
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: var(--font-sans);
      margin-bottom: 0.75rem;
      outline: none;
      text-align: center;
      letter-spacing: 0.05em;
    }
    .login-input:focus { border-color: var(--gln-olive); }
    .login-btn {
      width: 100%;
      padding: 0.65rem;
      background: var(--gln-olive);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-family: var(--font-sans);
      cursor: pointer;
    }
    .login-btn:hover { background: #636b62; }
    .login-error {
      color: var(--gln-error);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    @media (max-width: 600px) {
      .case-card {
        grid-template-columns: 1fr;
      }
      .case-actions {
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body class="report-body">

  <header class="site-header">
    <div class="header-inner">
      <div class="site-logo">
        GLN <span>好感生活提案 · 案件後台</span>
      </div>
      <div id="header-actions"></div>
    </div>
  </header>

  <main class="container" style="max-width: 860px; padding-bottom: 4rem;">
    <div id="app"></div>
  </main>

  <footer class="site-footer no-print">
    GLN 好感生活提案 · Good Living Notes ©
  </footer>

  <script src="cases.js"></script>
</body>
</html>
