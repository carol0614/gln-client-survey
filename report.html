<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>GLN 客戶報告</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;500;600&family=Ibarra+Real+Nova:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .cmn-meeting { margin-bottom: 1rem; }
    .cmn-meeting-ts { font-size: .8rem; color: #8a8472; margin-bottom: .3rem; }
    .cmn-summary { background: #faf8f3; border-left: 3px solid #c8a96a; padding: .7rem 1rem; border-radius: 4px; margin: 0; list-style-position: inside; }
    .cmn-summary li { margin: .25rem 0; }
    .cmn-comment-thread { margin-top: 1.2rem; padding: .8rem 1rem; background: #faf8f3; border: 1px solid #e6e1d6; border-radius: 8px; }
    .cmn-comment-head { font-weight: 600; margin-bottom: .5rem; color: #3a362e; }
    .cmn-comment { display: flex; flex-wrap: wrap; align-items: baseline; gap: .4rem; padding: .35rem 0; border-bottom: 1px dashed #e6e1d6; }
    .cmn-comment-author { font-size: .72rem; font-weight: 600; padding: .05rem .45rem; border-radius: 999px; flex-shrink: 0; }
    .cmn-comment.director .cmn-comment-author { background: rgba(111,106,60,.18); color: #6f6a3c; }
    .cmn-comment.designer .cmn-comment-author { background: #e3ebe1; color: #4a7040; }
    .cmn-comment.client .cmn-comment-author { background: #f3e3e8; color: #a05068; }
    .cmn-comment-text { flex: 1; min-width: 60%; }
    .cmn-comment-ts { font-size: .72rem; color: #8a8472; margin-left: auto; }
    .cmn-comment-add { display: flex; gap: .5rem; margin-top: .7rem; }
    .cmn-comment-add input { flex: 1; padding: .45rem .7rem; border: 1px solid #e6e1d6; border-radius: 6px; font-size: .9rem; font-family: inherit; }
    .cmn-comment-add input:focus { border-color: #6f6a3c; outline: none; }
    .cmn-meeting-client .cmn-summary { border-left-color: #a05068; background: #fbf3f5; }
    .cmn-note-add { margin-top: 1rem; padding: .8rem 1rem; background: #fbf9f4; border: 1px dashed #d8c7a4; border-radius: 8px; }
    .cmn-note-head { font-weight: 600; color: #a8743a; }
    .cmn-note-add textarea { width: 100%; box-sizing: border-box; padding: .5rem .7rem; border: 1px solid #e6e1d6; border-radius: 6px; font-size: .9rem; font-family: inherit; resize: vertical; margin-bottom: .5rem; }
    .cmn-note-add textarea:focus { border-color: #6f6a3c; outline: none; }
    .so-panel { border: 1px solid #e6e1d6; border-radius: 10px; background: #fbf9f4; }
    .so-panel.published { border-color: #b8cdb0; background: #f4f8f2; }
    .so-step { display: flex; align-items: center; gap: .8rem; padding: .7rem .2rem; border-bottom: 1px dashed #e6e1d6; }
    .so-step:last-of-type { border-bottom: none; }
    .so-step-num { flex-shrink: 0; width: 1.7rem; height: 1.7rem; border-radius: 999px; background: #e6e1d6; color: #6f6a3c; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: .9rem; }
    .so-step.done .so-step-num { background: #7B9070; color: #fff; }
    .so-step-body { flex: 1; min-width: 40%; }
    .so-step-title { font-weight: 600; color: #3a362e; }
    .so-step-meta { font-size: .78rem; color: #6f6a3c; }
    .so-step-meta.muted { color: #8a8472; }
    .so-step-action { margin-left: auto; }
    .so-status { margin-top: .9rem; padding: .55rem .8rem; border-radius: 6px; font-size: .85rem; }
    .so-status.pending { background: #faf3e6; color: #a8743a; }
    .so-status.ok { background: #e9f2e5; color: #4a7040; }
  </style>
</head>
<body class="report-body">

  <header class="site-header">
    <div class="header-inner">
      <div class="site-logo">
        GLN <span>好感生活提案 · 客戶報告</span>
      </div>
      <div class="report-toggle">
        <a href="#" data-version="client" class="toggle-btn">客戶版</a>
        <a href="#" data-version="designer" class="toggle-btn">設計師版</a>
        <button type="button" id="print-btn" class="btn btn-ghost btn-sm">列印</button>
      </div>
    </div>
  </header>

  <main class="container report-container">
    <div id="report-root">
      <p class="muted" style="text-align:center; padding: 4rem 0;">載入中…</p>
    </div>
  </main>

  <footer class="site-footer no-print">
    GLN 好感生活提案 · Good Living Notes ©
  </footer>

  <script src="report.js"></script>
</body>
</html>
